name: Research orchestrator tests

on:
  pull_request:
    paths:
      - "dkt_agent/research_orchestrator.py"
      - "tests/python/test_research_orchestrator.py"
      - ".github/workflows/research-orchestrator.yml"
  push:
    branches: [main]
    paths:
      - "dkt_agent/research_orchestrator.py"
      - "tests/python/test_research_orchestrator.py"
      - ".github/workflows/research-orchestrator.yml"

jobs:
  research-planner:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install planner dependency
        run: python -m pip install "langchain-core==1.7.6"
      - name: Run research planner tests
        run: python tests/python/test_research_orchestrator.py
