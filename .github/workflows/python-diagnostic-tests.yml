name: Python diagnostic tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/mixing-hierarchy-diagnostics
      - feature/periodic-orbit-hierarchy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mixing-hierarchy-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run mixing-hierarchy and autocorrelation tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/python/test_mixing_hierarchy.py \
            tests/python/test_advanced_diagnostics.py \
            tests/python/test_periodic_orbits.py \
            tests/python/test_research_director.py \
            tests/python/test_presentation.py \
            tests/python/test_theory_tools.py \
            tests/python/test_research_director_ui.py
