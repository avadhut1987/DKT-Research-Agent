name: Python syntax checks

on:
  push:
    branches: [main, feature/entanglement-dynamics, feature/periodic-orbit-hierarchy]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Compile Python modules
        run: python -m compileall -q app.py dkt_agent pages tests/python/test_research_director.py
