name: One-time cleanup of merged feature branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-merged-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.event.head_commit.message == 'Run one-time cleanup of merged branches' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete the two merged feature branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            feat/scientific-campaign-review \
            feat/streamlit-polish-and-ergodic-workflows
          do
            gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/${branch}"
            echo "Deleted merged branch: ${branch}"
          done
