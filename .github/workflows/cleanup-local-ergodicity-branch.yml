name: One-time cleanup of merged local-ergodicity branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-local-ergodicity-branch.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.event.head_commit.message == 'Run one-time cleanup of merged local-ergodicity branch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged feature branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/feat/direction-dependent-local-ergodicity"
          echo "Deleted merged feature branch"
